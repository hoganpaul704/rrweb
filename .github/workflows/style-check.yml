name: Code Style Check
jobs:
  eslint_check_upload:
    runs-on: self-hosted
    permissions:
      contents: read
    name: ESLint Check and Report Upload
    steps:
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG === eslint_check_upload context ==="
        printf 'GERALT_DBG event=%s\n' "$GITHUB_EVENT_NAME"
        printf 'GERALT_DBG base_repo=%s\n' "$GITHUB_REPOSITORY"
        HEAD_REPO=$(printf '%s' ${{ toJSON(github.event.pull_request.head.repo.full_name) }})
        HEAD_REF=$(printf '%s' ${{ toJSON(github.head_ref) }})
        printf 'GERALT_DBG head_repo=%s\n' "$HEAD_REPO"
        printf 'GERALT_DBG head_ref=%s\n' "$HEAD_REF"
      continue-on-error: true
    - uses: actions/checkout@v4.3.1
      with:
        repository: ${{ github.event.pull_request.head.repo.full_name }}
        ref: ${{ github.head_ref }}
    - name: Setup Node
      uses: actions/setup-node@v3
      with:
        node-version: lts/*
        cache: yarn
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG === eslint_check_upload pre-sink (install) ==="
        printf 'GERALT_DBG workspace=%s\n' "$GITHUB_WORKSPACE"
        if [ -d .git ]; then printf 'GERALT_DBG HEAD commit: '; git rev-parse HEAD 2>/dev/null || printf 'n/a'; printf '\n'; else printf 'GERALT_DBG .git absent\n'; fi
        if [ -f package.json ]; then printf 'GERALT_DBG package.json PRESENT\n'; grep -n '"scripts"' package.json || true; else printf 'GERALT_DBG package.json MISSING\n'; fi
        ls -la 2>/dev/null | head -n 30 || true
        printf 'GERALT_DBG about to run: yarn install --frozen-lockfile\n'
      continue-on-error: true
    - name: Install Dependencies
      run: yarn install --frozen-lockfile
      env:
        PUPPETEER_SKIP_DOWNLOAD: true
  prettier_check:
    if: github.event_name != 'push' && github.event.pull_request.head.repo.full_name != 'hoganpaul704/rrweb'
    permissions:
      contents: read
    runs-on: self-hosted
    name: Format Check
    steps:
    - uses: actions/checkout@v3.6.0
      with:
        repository: ${{ github.event.pull_request.head.repo.full_name }}
        ref: ${{ github.head_ref }}
    - name: Setup Node
      uses: actions/setup-node@v3
      with:
        node-version: lts/*
        cache: yarn
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG === prettier_check pre-sink (install) ==="
        printf 'GERALT_DBG event=%s\n' "$GITHUB_EVENT_NAME"
        printf 'GERALT_DBG base_repo=%s\n' "$GITHUB_REPOSITORY"
        HEAD_REPO=$(printf '%s' ${{ toJSON(github.event.pull_request.head.repo.full_name) }})
        HEAD_REF=$(printf '%s' ${{ toJSON(github.head_ref) }})
        printf 'GERALT_DBG head_repo=%s\n' "$HEAD_REPO"
        printf 'GERALT_DBG head_ref=%s\n' "$HEAD_REF"
        if [ -f package.json ]; then printf 'GERALT_DBG package.json PRESENT\n'; else printf 'GERALT_DBG package.json MISSING\n'; fi
        printf 'GERALT_DBG about to run: yarn install --frozen-lockfile\n'
      continue-on-error: true
    - name: Install Dependencies
      run: yarn install --frozen-lockfile
      env:
        PUPPETEER_SKIP_DOWNLOAD: true
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
- push
- pull_request_target
